# Render Blueprint — optional backup mirror of the static PWA (primary host: Vercel, see README "Deployment").
services:
  - type: web
    name: ikawa
    runtime: static
    rootDir: app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=(self)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
